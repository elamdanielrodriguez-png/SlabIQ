<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SlabIQ Eval</title>
<style>
  :root {
    --bg: #000;
    --panel: #0f0f12;
    --panel-2: #16161a;
    --border: rgba(255,255,255,0.08);
    --text: #fff;
    --muted: rgba(255,255,255,0.45);
    --dim: rgba(255,255,255,0.28);
    --gold: #c9a84c;
    --green: #30d158;
    --red: #ff453a;
    --yellow: #ffd60a;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(0,0,0,0.78);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header .title { font-size: 17px; font-weight: 700; letter-spacing: -0.4px; }
  header .title small { color: var(--gold); font-size: 11px; font-weight: 500;
    letter-spacing: 0.06em; margin-left: 8px; }
  header .meta { font-size: 12px; color: var(--muted); }
  main { max-width: 1200px; margin: 0 auto; padding: 28px 24px 80px; }
  .empty { text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty code { background: var(--panel); padding: 4px 10px; border-radius: 6px;
    color: var(--gold); font-size: 13px; }

  /* Section */
  .section-title { font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); margin: 28px 0 14px; }

  /* Metric cards */
  .metric-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px; }
  .metric {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 18px;
  }
  .metric .label { font-size: 11px; color: var(--muted);
    letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
  .metric .value { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  .metric .sub { font-size: 12px; color: var(--dim); margin-top: 6px;
    display: flex; gap: 12px; flex-wrap: wrap; }
  .metric.bgs { padding: 14px 16px; }
  .metric.bgs .value { font-size: 22px; }

  /* Per-card list */
  .card-list { display: flex; flex-direction: column; gap: 10px; }
  .card-row {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
    display: grid;
    grid-template-columns: 64px 1fr auto;
    gap: 16px; align-items: center;
    cursor: pointer; transition: background 0.15s ease;
  }
  .card-row:hover { background: var(--panel-2); }
  .card-row.expanded { grid-template-columns: 1fr; align-items: stretch; }
  .thumb {
    width: 64px; height: 64px; border-radius: 8px; overflow: hidden;
    background: #222; display: flex; align-items: center; justify-content: center;
    color: var(--dim); font-size: 10px;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .name { font-size: 14px; font-weight: 600; letter-spacing: -0.1px; }
  .name .id-meta { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .grades { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
  .grade-pair { font-size: 13px; }
  .grade-pair .lbl { color: var(--muted); margin-right: 6px; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
  .grade-pair .val.exact { color: var(--green); font-weight: 600; }
  .grade-pair .val.close { color: var(--yellow); font-weight: 600; }
  .grade-pair .val.off { color: var(--red); font-weight: 600; }
  .grade-pair .val.unknown { color: var(--dim); }
  .grade-pair .truth { color: var(--muted); }

  /* Expanded detail */
  .detail { padding-top: 14px; border-top: 1px solid var(--border); margin-top: 14px;
    display: grid; grid-template-columns: minmax(280px, 1fr) 2fr; gap: 24px; }
  .detail .photos { display: flex; flex-direction: column; gap: 8px; }
  .detail .photos img { width: 100%; border-radius: 10px; border: 1px solid var(--border); display: block; }
  .detail .photos .photo-label { font-size: 11px; color: var(--dim); margin-top: -4px; }
  .detail .breakdown { font-size: 13px; }
  .detail .breakdown table { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  .detail .breakdown th, .detail .breakdown td { text-align: left; padding: 8px 10px;
    border-bottom: 1px solid var(--border); font-weight: 400; }
  .detail .breakdown th { color: var(--muted); font-size: 11px; letter-spacing: 0.04em;
    text-transform: uppercase; font-weight: 500; }
  .detail .breakdown td.diff-exact { color: var(--green); }
  .detail .breakdown td.diff-close { color: var(--yellow); }
  .detail .breakdown td.diff-off { color: var(--red); }
  .detail .verdict { color: var(--muted); font-style: italic; font-size: 13px;
    line-height: 1.55; padding: 12px 14px; background: var(--panel-2);
    border-radius: 10px; border: 1px solid var(--border); margin-bottom: 12px; }
  .detail .raw-json { background: #000; border: 1px solid var(--border);
    border-radius: 10px; padding: 12px; max-height: 320px; overflow: auto;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; color: var(--muted); white-space: pre-wrap; word-break: break-word; }

  .error-row { color: var(--red); font-size: 12px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 100px;
    font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
    background: rgba(255,255,255,0.06); color: var(--muted); margin-left: 6px; }
  .badge.error { background: rgba(255,69,58,0.12); color: var(--red); }
  .badge.bias-pos { background: rgba(255,214,10,0.1); color: var(--yellow); }
  .badge.bias-neg { background: rgba(48,209,88,0.1); color: var(--green); }
  .badge.bias-zero { background: rgba(255,255,255,0.06); color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; user-select: none; }
  details summary:hover { color: var(--text); }
</style>
</head>
<body>
<header>
  <div>
    <span class="title">SlabIQ Eval <small>DASHBOARD</small></span>
  </div>
  <div class="meta" id="run-meta"></div>
</header>
<main id="main"></main>

<script src="results/latest.js"></script>
<script>
  const data = window.SLABIQ_EVAL_RESULTS;
  const main = document.getElementById('main');
  const meta = document.getElementById('run-meta');

  function fmt(n, d = 2) {
    if (n == null || Number.isNaN(n)) return '–';
    return Number(n).toFixed(d);
  }

  function biasBadge(bias) {
    if (bias == null) return '';
    const v = Number(bias);
    if (Math.abs(v) < 0.05) return `<span class="badge bias-zero">bias 0.0</span>`;
    const cls = v > 0 ? 'bias-pos' : 'bias-neg';
    const sign = v > 0 ? '+' : '';
    return `<span class="badge ${cls}">bias ${sign}${v.toFixed(2)}</span>`;
  }

  function diffClass(predicted, actual, tol = 0.5) {
    if (predicted == null || actual == null) return 'unknown';
    if (predicted === actual) return 'exact';
    if (Math.abs(predicted - actual) <= tol) return 'close';
    return 'off';
  }

  function gradePair(label, predicted, actual, tol = 0.5) {
    const cls = diffClass(predicted, actual, tol);
    const predStr = predicted == null ? '–' : predicted;
    const actStr = actual == null ? '–' : actual;
    return `
      <div class="grade-pair">
        <span class="lbl">${label}</span>
        <span class="val ${cls}">${predStr}</span>
        <span class="truth"> / ${actStr}</span>
      </div>
    `;
  }

  function renderEmpty(msg) {
    main.innerHTML = `<div class="empty">
      <p>${msg}</p>
      <p style="margin-top:18px;">Run <code>node eval/run.js</code> after the server is up (<code>npm run server</code>) to populate this dashboard.</p>
    </div>`;
  }

  if (!data) {
    renderEmpty('No eval results loaded yet.');
  } else if (!data.rows || !data.rows.length) {
    renderEmpty('Eval ran but produced no rows.');
  } else {
    const errCount = data.nErrors || 0;
    const okCount = data.nCards - errCount;
    meta.innerHTML = `
      <div>${new Date(data.runAt).toLocaleString()}</div>
      <div style="font-size:11px; color: var(--dim); text-align: right; margin-top: 2px;">
        ${data.api} · ${okCount} graded${errCount ? ` · <span style="color: var(--red);">${errCount} errored</span>` : ''}
      </div>
    `;

    const psa = data.report?.psa;
    const bgs = data.report?.bgs || {};

    let html = '';

    // PSA summary
    html += `<div class="section-title">PSA accuracy</div>`;
    html += `<div class="metric-row">`;
    if (psa && psa.n) {
      html += `
        <div class="metric">
          <div class="label">Exact match</div>
          <div class="value">${psa.exactPct}%</div>
          <div class="sub">${psa.exact}/${psa.n} cards</div>
        </div>
        <div class="metric">
          <div class="label">Within ±1 grade</div>
          <div class="value">${psa.within1Pct ?? '–'}%</div>
          <div class="sub">forgiving threshold</div>
        </div>
        <div class="metric">
          <div class="label">Mean bias</div>
          <div class="value">${psa.meanBias > 0 ? '+' : ''}${fmt(psa.meanBias, 2)}</div>
          <div class="sub">${psa.meanBias > 0 ? 'over-grades on average' : psa.meanBias < 0 ? 'under-grades on average' : 'unbiased'}</div>
        </div>
        <div class="metric">
          <div class="label">MAE</div>
          <div class="value">${fmt(psa.mae, 2)}</div>
          <div class="sub">avg abs error</div>
        </div>
      `;
    } else {
      html += `<div class="metric"><div class="label">PSA</div><div class="value" style="font-size:14px;color:var(--dim);">No ground-truth PSA grades found.</div></div>`;
    }
    html += `</div>`;

    // BGS subgrades
    html += `<div class="section-title">BGS subgrade breakdown</div>`;
    html += `<div class="metric-row">`;
    const bgsKeys = ['overall', 'centering', 'corners', 'edges', 'surface'];
    for (const k of bgsKeys) {
      const s = bgs[k];
      if (!s || !s.n) {
        html += `<div class="metric bgs"><div class="label">${k}</div><div class="value" style="color: var(--dim); font-size: 14px;">no data</div></div>`;
        continue;
      }
      html += `
        <div class="metric bgs">
          <div class="label">${k} ${biasBadge(s.meanBias)}</div>
          <div class="value">${s.exactPct}%</div>
          <div class="sub">
            <span>exact ${s.exact}/${s.n}</span>
            <span>within±0.5 ${s.withinPct}%</span>
            <span>MAE ${fmt(s.mae, 2)}</span>
          </div>
        </div>
      `;
    }
    html += `</div>`;

    // Per-card list
    html += `<div class="section-title">Per-card results</div>`;
    html += `<div class="card-list">`;
    for (const r of data.rows) {
      const c = r.truth?.card || {};
      const cardId = [c.year, c.set, c.player, c.variant].filter(Boolean).join(' ');
      if (r.error) {
        html += `<div class="card-row" style="grid-template-columns: 64px 1fr;">
          <div class="thumb">no img</div>
          <div>
            <div class="name">${escapeHtml(r.name)} <span class="badge error">error</span></div>
            <div class="error-row">${escapeHtml(r.error)}</div>
          </div>
        </div>`;
        continue;
      }
      const firstImg = r.images?.[0];
      const thumbSrc = firstImg ? `dataset/${encodeURIComponent(r.name)}/${encodeURIComponent(firstImg)}` : '';
      const thumb = thumbSrc
        ? `<div class="thumb"><img src="${thumbSrc}" alt="" onerror="this.style.display='none';this.parentElement.textContent='no img';"></div>`
        : `<div class="thumb">no img</div>`;
      const psaP = r.predicted?.psa;
      const psaA = r.actual?.psa;
      const bgsP = r.predicted?.bgs?.overall;
      const bgsA = r.actual?.bgs?.overall;
      html += `
        <div class="card-row" data-name="${escapeHtml(r.name)}">
          ${thumb}
          <div>
            <div class="name">${escapeHtml(r.name)} <span class="id-meta">${escapeHtml(cardId)}</span></div>
            <div class="grades">
              ${gradePair('PSA', psaP, psaA, 0.5)}
              ${gradePair('BGS', bgsP, bgsA, 0.5)}
              <span style="font-size:11px;color:var(--dim);">${r.elapsedMs}ms</span>
            </div>
          </div>
          <div style="color: var(--dim); font-size: 12px;">expand ›</div>
        </div>
      `;
    }
    html += `</div>`;

    main.innerHTML = html;

    // Expand-on-click
    document.querySelectorAll('.card-row[data-name]').forEach(row => {
      row.addEventListener('click', () => {
        const name = row.getAttribute('data-name');
        const r = data.rows.find(x => x.name === name);
        if (!r) return;
        if (row.classList.contains('expanded')) {
          row.classList.remove('expanded');
          row.querySelector('.detail')?.remove();
          return;
        }
        row.classList.add('expanded');
        row.insertAdjacentHTML('beforeend', renderDetail(r));
      });
    });
  }

  function renderDetail(r) {
    const photos = (r.images || []).map(name => {
      const src = `dataset/${encodeURIComponent(r.name)}/${encodeURIComponent(name)}`;
      return `<div><img src="${src}" alt="" onerror="this.style.display='none';"><div class="photo-label">${escapeHtml(name)}</div></div>`;
    }).join('');

    const subgrades = ['overall', 'centering', 'corners', 'edges', 'surface'];
    const rows = subgrades.map(k => {
      const p = r.predicted?.bgs?.[k];
      const a = r.actual?.bgs?.[k];
      const cls = diffClass(p, a, 0.5);
      const diffStr = (p != null && a != null) ? ((p - a) > 0 ? `+${(p-a).toFixed(1)}` : (p-a).toFixed(1)) : '–';
      return `<tr>
        <td style="text-transform:capitalize;">${k}</td>
        <td>${p ?? '–'}</td>
        <td>${a ?? '–'}</td>
        <td class="diff-${cls}">${diffStr}</td>
      </tr>`;
    }).join('');

    const psaP = r.predicted?.psa;
    const psaA = r.actual?.psa;
    const psaCls = diffClass(psaP, psaA, 0.5);
    const psaDiff = (psaP != null && psaA != null) ? (psaP - psaA > 0 ? `+${psaP - psaA}` : `${psaP - psaA}`) : '–';

    return `<div class="detail">
      <div class="photos">${photos || '<div style="color:var(--dim);font-size:12px;">no photos</div>'}</div>
      <div class="breakdown">
        ${r.full?.verdict ? `<div class="verdict">${escapeHtml(r.full.verdict)}</div>` : ''}
        <table>
          <thead>
            <tr><th>Metric</th><th>Predicted</th><th>Actual</th><th>Δ</th></tr>
          </thead>
          <tbody>
            <tr>
              <td>PSA grade</td><td>${psaP ?? '–'}</td><td>${psaA ?? '–'}</td>
              <td class="diff-${psaCls}">${psaDiff}</td>
            </tr>
            ${rows}
          </tbody>
        </table>
        ${r.full?.negatives?.length ? `<div style="margin-bottom:10px;"><strong style="font-size:11px;letter-spacing:0.04em;color:var(--muted);text-transform:uppercase;">Negatives</strong><br>${r.full.negatives.map(n => '· ' + escapeHtml(n)).join('<br>')}</div>` : ''}
        ${r.full?.positives?.length ? `<div style="margin-bottom:10px;"><strong style="font-size:11px;letter-spacing:0.04em;color:var(--muted);text-transform:uppercase;">Positives</strong><br>${r.full.positives.map(n => '· ' + escapeHtml(n)).join('<br>')}</div>` : ''}
        <details><summary>Full predicted JSON</summary>
          <div class="raw-json">${escapeHtml(JSON.stringify(r.full, null, 2))}</div>
        </details>
      </div>
    </div>`;
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
</script>
</body>
</html>
